[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "svoo"
version = "0.1.0"
description = "Training-free sparse attention for video generation via offline sparsity profiling and online QK co-clustering"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [{ name = "FirstIntelligence" }]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pillow>=9.0.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.5.0",
    "einops>=0.6.0",
    "ninja",
    "psutil",
    "hatchling",
    "editables",
    "setuptools>=77",
    "packaging>=24.2",
    "apache-tvm-ffi>=0.1.6,!=0.1.8,!=0.1.8.post0,<0.2",
    "diffusers==0.36.0",
    "transformers>=4.49.2",
    "accelerate>=1.7.0",
    "ftfy",
    "imageio",
    "imageio-ffmpeg",
    "IPython",
    "termcolor",
    "tabulate",
    "lpips",
    "scikit-image",
    "loguru",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.900",
]

[tool.hatch.build.targets.wheel]
packages = ["svoo"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".mypy_cache", ".tox", ".venv", "build", "dist"]
src = ["svoo"]

[tool.ruff.lint]
extend-select = ["I", "E", "F"]
extend-ignore = ["E203", "E731", "D203", "D212", "E501", "F841"]


[tool.hatch.envs.lint]
dev-mode = false
dependencies = ["black", "ruff"]

[tool.hatch.envs.lint.scripts]
check = [
    "ruff check svoo",
    "black --check svoo",
]
fix = [
    "ruff check svoo --fix",
    "black svoo",
]
